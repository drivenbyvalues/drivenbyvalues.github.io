<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harish Raghavendra — Platform Product Manager building trustworthy, AI-native developer platforms." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('dbv-color-scheme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.setAttribute('data-color-scheme', resolved);

          var storedTheme = window.localStorage.getItem('dbv-theme');
          if (storedTheme !== 'current') {
            document.documentElement.setAttribute('data-theme', 'future');
          }
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Driven By Values" />
    <meta property="og:description" content="Career journey, articles, interests, photography, and yearly reflections from Harish Raghavendra." />
    <meta property="og:image" content="/assets/img/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
